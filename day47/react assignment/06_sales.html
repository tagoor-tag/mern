<!DOCTYPE html>
<html lang="en">

<head>
    <title>Assignment05</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            background-color: rgb(194, 246, 246);
        }

        header,.details1{
            background-color: white;
            margin: 10px;
            padding: 20px;
            border-radius: 10px;
        }

        header label {
            background-color: rgb(0, 143, 0);
            border-radius: 10px;
            padding: 10px;
            color: white;
        }

        header #p1 {
            font-family: sans-serif;
            font-size: small;
            color: rgb(46, 46, 46);
        }

        .h12,
        .p2 {
            display: inline;
            /* font-size: larger; */
        }

        .h12{
            color: rgb(81, 75, 255);
        }

        .p2{
            color: rgb(46, 46, 46);
        }

        header .button {
            display: flex;
            gap: 20px;
        }

        .details2{
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 20px;
            padding: 5px;
        }
    </style>
</head>

<body>


    <script type="text/babel">
        function Header() {
            return (
                <header>
                    <label>For Sale</label>
                    <h1>The Green Canton Chrysler</h1>
                    <p id="p1">778 Country St. Panama City, FL</p>
                    <h1 class="h12">$7,600 </h1><p class="p2">/Month</p>
                    <div class="button">
                        <p><i class="bi bi-house-fill"></i> 3 Beds</p>
                        <p><i class="bi bi-house-fill"> </i> 1 Bath</p>
                        <p><i class="bi bi-dpad"></i> 800 sqft</p>
                    </div>
                </header>
            );
        }

        function Detail() {
            return (
                <div class="details1">
                    <h1>Detail & Features</h1>
                    <div class="details2">
                       <span> <h4 class="h12">Bedrooms: </h4><p class="p2">3 Beds</p> </span>
                       <span> <h4 class="h12">Garage: </h4><p class="p2">1</p> </span>
                       <span> <h4 class="h12">Status: </h4><p class="p2">Active</p> </span>
                       <span> <h4 class="h12">Kitchen Features: </h4><p class="p2">Kitchen Facilities</p></span>
                       <span> <h4 class="h12">Elevetor: </h4><p class="p2">Yes</p></span>
                       <span> <h4 class="h12">Bathrooms: </h4><p class="p2">2 Bath</p></span>
                       <span> <h4 class="h12">Property Type: </h4><p class="p2">Apartment</p></span>
                       <span> <h4 class="h12">Cooling: </h4><p class="p2">Central A/C</p></span>
                       <span> <h4 class="h12">Exterior: </h4><p class="p2">FinishBrick</p></span>
                       <span> <h4 class="h12">Firplace: </h4><p class="p2">Yes</p></span>
                       <span> <h4 class="h12">Areas: </h4><p class="p2">4,240 sq ft</p></span>
                       <span> <h4 class="h12">Year: </h4><p class="p2">Built 1982</p></span>
                       <span> <h4 class="h12">Heating Type: </h4><p class="p2">Forced Air</p></span>
                       <span> <h4 class="h12">Swimming: </h4><p class="p2">Yes</p></span>
                       <span> <h4 class="h12">Free WiFi: </h4><p class="p2">No</p></span>
                    </div>

                </div>
            )
        }

        ReactDOM.render([<Header />, <Detail />], document.querySelector("body"));
    </script>
</body>

</html
