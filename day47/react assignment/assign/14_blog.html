<!DOCTYPE html>
<html lang="en">

<head>
    <title>Assignment05</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 500;
        }

        .blog{
            background-color: #fff;
            padding: 20px;
            width: 100%;
            height: 100vh;
        }

        header img{
            width:70%;
            height: 50vh;
            margin: 20px auto;
        }

        .details{
            display: flex;
            gap: 20px;
            /* justify-content: center; */
            align-items: center;
            margin-bottom: 20px;
        }

        .details i{
            color: rgb(0, 191, 255);
        }

        main{
            width: 70%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        main h1{
            font-weight: 900;
        }

        main button{
            width: fit-content;
            padding: 10px 20px;
            color: white;
            border: none;
            outline: none;
            border-radius: 5px;
            background-color: rgb(0, 191, 255);
            cursor: pointer;
        }
    </style>

</head>

<body>


    <script type="text/babel">
        function Blog(){
            return(
                <div class="blog">
                    <header>
                        <img src="https://static.vecteezy.com/system/resources/thumbnails/052/264/276/small_2x/a-group-of-people-raising-their-hands-in-the-air-free-video.jpg" alt="" />
                    </header>

                    <div class="details">
                        <p><i class="bi bi-pen-fill"></i>Written by Admin </p>
                        <p><i class="bi bi-calendar-fill"></i>10 Oct 2020 </p>
                        <p><i class="bi bi-google-play"></i>App. Startup </p>
                        <p><i class="bi bi-chat-dots-fill"></i> 4 Comments </p>
                    </div>

                    <main>
                        <h1>The six things marketers need to understand about DTC marketing </h1>
                        <p>Beautiful and usable design can be the deciding factor between a successful and a failing business. Great designers are treated like superstars. And it's so fulfilling to design beautiful things that people love to use.</p>
                        <button>Read More</button>
                    </main>
                    
                </div>
            );
        }

        ReactDOM.render(<Blog></Blog> , document.querySelector("body"));
    </script>
</body>

</html>
