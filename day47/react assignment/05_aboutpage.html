<!DOCTYPE html>
<html lang="en">

<head>
    <title>Assignment05</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .cart{
            width: 400px;
            height: 450px;
            box-shadow: 1px 1px 10px black;
            padding: 10px;
        }
        .mainCart{
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        header{
            padding: 10px;
            color: white;
            text-align: center;
            background-color: darkslategray;
        }
        h3{
            text-align: center;
        }
        .cart button{
            width: 100%;
            padding: 10px;
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>


    <script type="text/babel">
        function Header() {
            return (
                <header>
                    <h2>About Us Page</h2>
                    <p>Some text about who we are and what we do</p>
                    <p>Resize the browser window to see that this page is responsive by the way</p>
                </header>
            );
        }

        var h3 = <h3>Our Team</h3>

        function ContactCart(props) {
            return (
                <div class="cart">
                    <img src={props.url} alt="profile image" width="100%" height="50%" />
                    <h2>{props.name}</h2>
                    <p class="role">{props.role}</p>
                    <p>{props.discription}</p>
                    <p>{props.mail}</p>
                    <button>{props.contact}</button>
                </div>
            )
        }

        function Call() {
            return (
                <div class="mainCart">
                    <ContactCart url={"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Woman_1.jpg/480px-Woman_1.jpg"}
                        name={"Jane Doe"}
                        role={"CEO & Founder"}
                        discription={"Some text that describes me lorem ipsum ipsum lorem"}
                        mail={"jane@example.com"}
                        contact={"Contact"} />
                    <ContactCart url={"https://static.vecteezy.com/system/resources/thumbnails/048/632/363/small/male-doctor-in-gray-suit-and-tie-with-neutral-gray-background-free-photo.jpg"}
                        name={"Mike Ross"}
                        role={"Art Directer"}
                        discription={"Some text that describes me lorem ipsum ipsum lorem"}
                        mail={"mike@example.com"}
                        contact={"Contact"} />
                    <ContactCart url={"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTluq3uOF4OqSEK18Il-ji_PMPdm2p3XxMgsO1yZc-KZpw20aIDxhhvW62oEIJzenx6M7w&usqp=CAU"}
                        name={"John Doe"}
                        role={"Designer"}
                        discription={"Some text that describes me lorem ipsum ipsum lorem"}
                        mail={"john@example.com"}
                        contact={"Contact"} />

                </div>
            );
        }

        ReactDOM.render([<Header />, h3, <Call />], document.querySelector("body"))
    </script>
</body>

</html>
