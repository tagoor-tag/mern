<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-contaner {
            border: 10px solid rgb(45, 0, 244);
            background-color: rgb(255, 1, 1);
            /* width: 99%; */
            height: 600px;
            font-size: larger;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;

            
        }

        .grid1 {
            grid-column-start: 1;
            grid-column-end: 5;
            
            border: 2px solid black;
            background-color: pink;
        }

        .grid2 {
                border: 2px solid black;
            background-color: rgba(5, 198, 241, 0.664);
        }

        .grid3 {
            border: 2px solid black;
            background-color: rgba(34, 255, 0, 0.627);
        }

        .grid4 {
            border: 2px solid black;
            background-color: rgba(217, 142, 251, 0.744);
        }

        .grid5 {
            border: 2px solid black;
            background-color: rgb(81, 237, 130);
        }
    </style>
</head>

<body>
    <div class="grid-contaner">
        <div class="grid1">grid1 </div>
        <div class="grid2">grid2</div>
        <div class="grid3">grid3</div>
        <div class="grid4">grid4</div>
        <div class="grid5">grid5</div>
        <!-- <div class="grid6">grid6</div>
        <div class="grid7">grid7</div>
        <div class="grid8">grid8</div> -->
    </div>
</body>

</html>
