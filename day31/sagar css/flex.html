<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #flex-container{
            width: 800px;
            height: 400px;
            border: 2px solid red;
            display: flex;
            flex-direction: row;

        }
        .flex-items1{
            background-color: red;
            width: 40%;
        }
        .flex-items2{
            background-color: green;
            width: 30%;
        }
        .flex-items3{
            background-color: blue;
            width: 30%;
        }
        
    </style>

</head>

<body>
    <div id="flex-container">
        <div class="flex-items1">col 1</div>
        <div class="flex-items2">col 2</div>
        <div class="flex-items3">col 3</div>
    </div>
</body>

</html>
