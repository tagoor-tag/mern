<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>

<body>
    <div id="root">
        <img src="" alt="">
    </div>
    <script>
        var img = React.createElement("img",
            {
                src: "https://images.unsplash.com/photo-1480455624313-e29b44bbfde1?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bWVuJTIwcHJvZmlsZXxlbnwwfHwwfHx8MA%3D%3D",
                width: "500",
                height: "auto",
                alt: "it is image"
            });
        var h1 = React.createElement("h1", null, "Name: person1");
        var p = React.createElement("p", null, "This is image of person");

        ReactDOM.render([img, h1, p], document.getElementById("root"));
    </script>
</body>

</html>
