<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function showHidePassword(){
            var inputDomElememt = document.querySelector("input");
            var buttonDom = document.querySelector("button");

            
            if (inputDomElememt.type === "password") {
                inputDomElememt.type = "text";
                
                buttonDom.innerText = "Hide Password";
            } else {
                inputDomElememt.type = "password";
                
                buttonDom.innerText = "Show Password";
            }

        }
    </script>
    <h2>Show/Hide Password</h2>
    <input type="password" placeholder="password"/>
    <button onclick="showHidePassword()">Show Password</button>
</body>
</html>
