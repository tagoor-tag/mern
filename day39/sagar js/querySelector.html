<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <script>
        function changeContent() {
            //code
            var h2DomElement = document.querySelector("#h2");
            h2DomElement.innerText = "JS is super easy";
            h2DomElement.style.color = "red";
            h2DomElement.style.fontFamily = "cursive";
        }

        function fnBlue() {
            var h2DomElement = document.querySelector("#h2");
            h2DomElement.style.color = "blue";

           
        }

        function fnnormal() {
            var h2DomElement = document.querySelector("#h2");
            h2DomElement.style.color = "red";
        }

        function passwordBox(){
            var inputDomElememt = document.querySelector("#box");
           inputDomElememt.type = "password" 
        }
    </script>
</head>

<body>
    <h2 id="h2" onmouseenter="fnBlue()" onmouseleave="fnnormal()">QuerySlector</h2>
    <input id= "box" type="text" placeholder="enter text">
    <button onclick="passwordBox()" oncl>Submit</button>
</body>

</html>
