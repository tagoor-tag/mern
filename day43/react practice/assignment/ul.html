<!DOCTYPE html>
<html>

<head>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>

<body>
    <div id="ul">
       
    </div>
    <script>
        var li1 = React.createElement("li", null, "Item 1");
        var li2 = React.createElement("li", null, "Item 2");
        var li3 = React.createElement("li", null, "Item 3");
        
        var ul = React.createElement("ul", { type : "square" },[li1,li2,li3]);
        

        ReactDOM.render(ul, document.getElementById("ul"));

    </script>

</body>
</html>
